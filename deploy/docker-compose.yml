# Runs on the Oracle VM. Web traffic arrives only through the Cloudflare Tunnel
# (no inbound 80/443); the app port is bound to localhost for health checks.
services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    image: seoul-tennis:latest
    env_file: ../.env.production
    restart: always
    ports: ["127.0.0.1:3000:3000"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [app]
    restart: always
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
