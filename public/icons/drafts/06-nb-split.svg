<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 06: Diagonal Split — smaller ball, bigger text -->
  <defs>
    <clipPath id="rc">
      <rect width="512" height="512" rx="80"/>
    </clipPath>
    <!-- Ball base: large-radius radial gradient for directional sphere shading -->
    <!-- Center at upper-left of ball, r=320 to span entire ball diameter -->
    <!-- No fx/fy for librsvg compatibility -->
    <radialGradient id="ballBase" gradientUnits="userSpaceOnUse"
      cx="155" cy="148" r="320">
      <stop offset="0%" stop-color="#faffc8"/>
      <stop offset="8%" stop-color="#f0f8a0"/>
      <stop offset="22%" stop-color="#d8ec70"/>
      <stop offset="38%" stop-color="#b8d048"/>
      <stop offset="54%" stop-color="#8aaa28"/>
      <stop offset="68%" stop-color="#5a7c14"/>
      <stop offset="82%" stop-color="#34560a"/>
      <stop offset="100%" stop-color="#102800"/>
    </radialGradient>
    <!-- Diffuse highlight: warm white glow on lit side (strong) -->
    <radialGradient id="highlight" gradientUnits="userSpaceOnUse"
      cx="190" cy="185" r="130">
      <stop offset="0%" stop-color="#fffff0" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#fffff0" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#fffff0" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#fffff0" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fffff0" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow: linear overlay for extra lower-right depth -->
    <linearGradient id="shadow" gradientUnits="userSpaceOnUse"
      x1="175" y1="160" x2="405" y2="390">
      <stop offset="0%" stop-color="#0a1e00" stop-opacity="0"/>
      <stop offset="42%" stop-color="#0a1e00" stop-opacity="0"/>
      <stop offset="68%" stop-color="#0a1e00" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#0a1e00" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a1e00" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Rim light: gradient for positioned rim ellipse -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8ee78" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#d8ee78" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d8ee78" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular core: sharp bright point -->
    <radialGradient id="specCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="10%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular glow: broader soft halo -->
    <radialGradient id="specGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#rc)">
    <polygon points="0,0 512,0 0,512" fill="#facc15"/>
    <polygon points="512,0 512,512 0,512" fill="#a3e635"/>
    <line x1="0" y1="512" x2="512" y2="0" stroke="#000" stroke-width="8"/>
  </g>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- NB offset shadow -->
  <circle cx="272" cy="272" r="175" fill="#000"/>

  <!-- Ball: lit from upper-left ~10 o'clock -->
  <circle cx="256" cy="256" r="175" fill="url(#ballBase)"/>
  <circle cx="256" cy="256" r="175" fill="url(#highlight)"/>
  <circle cx="256" cy="256" r="175" fill="url(#shadow)"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#000" stroke-width="6"/>

  <!-- SEAM (center 256,256, radius 175, Lucide proportions) -->
  <path d="M 81,256 C 172,256 256,172 256,81" fill="none" stroke="#4d7c0f" stroke-width="16" stroke-linecap="round"/>
  <path d="M 431,256 C 340,256 256,340 256,431" fill="none" stroke="#4d7c0f" stroke-width="16" stroke-linecap="round"/>
  <path d="M 81,256 C 172,256 256,172 256,81" fill="none" stroke="#3f6212" stroke-width="4" stroke-dasharray="3,16" stroke-linecap="round"/>
  <path d="M 431,256 C 340,256 256,340 256,431" fill="none" stroke="#3f6212" stroke-width="4" stroke-dasharray="3,16" stroke-linecap="round"/>

  <!-- Rim light: on top of seams for visibility in lower-right shadow -->
  <ellipse cx="338" cy="332" rx="68" ry="36" fill="#c8e060" opacity="0.35" transform="rotate(42 338 332)"/>
  <ellipse cx="356" cy="348" rx="44" ry="22" fill="#daf080" opacity="0.45" transform="rotate(42 356 348)"/>

  <!-- Specular highlight: larger glow + sharp core -->
  <ellipse cx="190" cy="186" rx="44" ry="26" fill="url(#specGlow)" transform="rotate(-30 190 186)"/>
  <ellipse cx="193" cy="183" rx="20" ry="11" fill="url(#specCore)" transform="rotate(-30 193 183)"/>
</svg>
