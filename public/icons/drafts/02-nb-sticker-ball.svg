<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 02: Sticker Ball — White bg, NB sticker shadow -->
  <rect width="512" height="512" fill="#fff" rx="80"/>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- NB sticker shadow -->
  <circle cx="276" cy="276" r="200" fill="#000"/>
  <!-- Tennis ball body -->
  <circle cx="256" cy="256" r="200" fill="#a3e635"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#000" stroke-width="6"/>

  <!-- SEAM v5: Lucide proportions -->
  <path d="M 56,260 C 163,260 260,163 260,56" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <path d="M 456,260 C 349,260 260,349 260,456" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <path d="M 56,256 C 163,256 256,163 256,56" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 456,256 C 349,256 256,349 256,456" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <!-- Inner ridge line -->
  <path d="M 56,256 C 163,256 256,163 256,56" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 456,256 C 349,256 256,349 256,456" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>

  <!-- Hash marks along seams for texture -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="98" y1="248" x2="105" y2="238"/>
    <line x1="138" y1="242" x2="148" y2="232"/>
    <line x1="178" y1="228" x2="190" y2="220"/>
    <line x1="220" y1="198" x2="230" y2="190"/>
    <line x1="248" y1="148" x2="250" y2="136"/>
    <line x1="268" y1="310" x2="262" y2="320"/>
    <line x1="290" y1="280" x2="280" y2="288"/>
    <line x1="340" y1="264" x2="330" y2="272"/>
    <line x1="388" y1="258" x2="378" y2="262"/>
  </g>

  <ellipse cx="188" cy="188" rx="36" ry="20" fill="#fff" opacity="0.18" transform="rotate(-35 188 188)"/>
</svg>
