<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 03: Court + Ball — Cyan bg -->
  <rect width="512" height="512" fill="#22d3ee" rx="80"/>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- Court -->
  <rect x="56" y="96" width="400" height="320" fill="#16a34a" stroke="#000" stroke-width="5" rx="4"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#fff" stroke-width="4"/>
  <line x1="256" y1="96" x2="256" y2="416" stroke="#fff" stroke-width="3"/>
  <rect x="116" y="156" width="280" height="200" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- Ball NB shadow -->
  <circle cx="376" cy="366" r="105" fill="#000"/>
  <!-- Ball -->
  <circle cx="362" cy="352" r="105" fill="#a3e635"/>
  <circle cx="362" cy="352" r="105" fill="none" stroke="#000" stroke-width="5"/>

  <!-- SEAM (center 362,352, radius 105, Lucide proportions) -->
  <!-- left=257, top=247, right=467, bottom=457 -->
  <path d="M 257,352 C 313,352 362,313 362,247" fill="none" stroke="#000" stroke-width="13" stroke-linecap="round"/>
  <path d="M 467,352 C 411,352 362,391 362,457" fill="none" stroke="#000" stroke-width="13" stroke-linecap="round"/>
  <path d="M 257,352 C 313,352 362,313 362,247" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 467,352 C 411,352 362,391 362,457" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <ellipse cx="334" cy="322" rx="18" ry="11" fill="#fff" opacity="0.2" transform="rotate(-30 334 322)"/>
</svg>
