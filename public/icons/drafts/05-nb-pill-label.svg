<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 05: Pill Label — Dark bg, ball + ST pill -->
  <rect width="512" height="512" fill="#1a1a1a" rx="80"/>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#a3e635" stroke-width="6" rx="78"/>

  <!-- Ball shadow -->
  <circle cx="268" cy="246" r="190" fill="#3a4a00" opacity="0.5"/>
  <!-- Ball -->
  <circle cx="256" cy="236" r="190" fill="#a3e635"/>
  <circle cx="256" cy="236" r="190" fill="none" stroke="#000" stroke-width="6"/>

  <!-- SEAM (center 256,236, radius 190, Lucide proportions) -->
  <!-- left=66, top=46, right=446, bottom=426 -->
  <path d="M 66,240 C 170,240 260,170 260,46" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <path d="M 446,240 C 342,240 260,302 260,426" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round"/>
  <path d="M 66,236 C 167,236 256,167 256,46" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 446,236 C 345,236 256,305 256,426" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 66,236 C 167,236 256,167 256,46" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 446,236 C 345,236 256,305 256,426" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>

  <ellipse cx="190" cy="178" rx="42" ry="24" fill="#fff" opacity="0.1" transform="rotate(-30 190 178)"/>

  <!-- ST pill -->
  <rect x="162" y="392" width="200" height="64" rx="32" fill="#000" transform="translate(4,4)"/>
  <rect x="158" y="388" width="200" height="64" rx="32" fill="#facc15" stroke="#000" stroke-width="5"/>
  <text x="258" y="430" text-anchor="middle" font-family="'Arial Black','Helvetica',sans-serif" font-weight="900" font-size="36" fill="#000" letter-spacing="6">ST</text>
</svg>
