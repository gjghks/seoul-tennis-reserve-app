<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 01: Bold Ball — Yellow NB bg, Lucide-scaled seam geometry -->
  <rect width="512" height="512" fill="#facc15" rx="80"/>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- NB offset shadow -->
  <circle cx="272" cy="272" r="200" fill="#000"/>
  <!-- Tennis ball body -->
  <circle cx="256" cy="256" r="200" fill="#a3e635"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#000" stroke-width="6"/>

  <!--
    SEAM v5: Exact Lucide Lab proportions scaled to 512px.
    Lucide (24x24, r=10): M2,12 C7.5,12 12,7.5 12,2
    Scale: x21.33 → viewBox 512, center 256, radius 200
    Left=56, Top=56, Right=456, Bottom=456

    Seam 1: M56,256 C163,256 256,163 256,56
      CP1=(163,256): same Y as start, pulled right → curve goes RIGHT first
      CP2=(256,163): same X as end, pulled down → curve approaches TOP vertically
      Midpoint ≈ (195,194) — deep in upper-left interior

    Seam 2: M456,256 C349,256 256,349 256,456
      Mirror of seam 1 in lower-right quadrant
  -->
  <!-- Seam black outlines (thick for NB) -->
  <path d="M 56,260 C 163,260 260,163 260,56" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round"/>
  <path d="M 456,260 C 349,260 260,349 260,456" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round"/>
  <!-- Seam 1 white: left(56,256) → top(256,56) -->
  <path d="M 56,256 C 163,256 256,163 256,56" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <!-- Seam 2 white: right(456,256) → bottom(256,456) -->
  <path d="M 456,256 C 349,256 256,349 256,456" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <!-- Inner seam line (double-line felt ridge effect) -->
  <path d="M 56,256 C 163,256 256,163 256,56" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 456,256 C 349,256 256,349 256,456" fill="none" stroke="#d4e88a" stroke-width="4" stroke-linecap="round"/>

  <!-- Highlight -->
  <ellipse cx="190" cy="190" rx="38" ry="22" fill="#fff" opacity="0.15" transform="rotate(-35 190 190)"/>
</svg>
