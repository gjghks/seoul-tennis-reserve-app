<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 06: Flat clean version for pixelation — v2 high contrast -->
  <defs>
    <clipPath id="rc">
      <rect width="512" height="512" rx="80"/>
    </clipPath>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="175"/>
    </clipPath>
  </defs>

  <!-- Background: diagonal split -->
  <g clip-path="url(#rc)">
    <polygon points="0,0 512,0 0,512" fill="#facc15"/>
    <polygon points="512,0 512,512 0,512" fill="#a3e635"/>
    <line x1="0" y1="512" x2="512" y2="0" stroke="#000" stroke-width="10"/>
  </g>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- NB offset shadow (stronger offset) -->
  <circle cx="270" cy="270" r="178" fill="#000"/>

  <!-- Ball: bright base -->
  <circle cx="256" cy="256" r="175" fill="#d4e840"/>

  <!-- 3-zone flat shading for clear depth -->
  <g clip-path="url(#ballClip)">
    <!-- Bright highlight upper-left -->
    <circle cx="195" cy="195" r="120" fill="#f0ff70"/>
    <!-- Deep shadow lower-right -->
    <circle cx="330" cy="330" r="130" fill="#7a9a10"/>
    <circle cx="370" cy="370" r="90" fill="#506a08"/>
  </g>

  <!-- Ball outline (thick for pixel visibility) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#000" stroke-width="10"/>

  <!-- SEAM: high contrast dark green, thick -->
  <path d="M 81,256 C 172,256 256,172 256,81" fill="none" stroke="#2d4a00" stroke-width="20" stroke-linecap="round"/>
  <path d="M 431,256 C 340,256 256,340 256,431" fill="none" stroke="#2d4a00" stroke-width="20" stroke-linecap="round"/>

  <!-- Seam fuzz/texture lines -->
  <path d="M 81,256 C 172,256 256,172 256,81" fill="none" stroke="#e8f890" stroke-width="6" stroke-dasharray="4,18" stroke-linecap="round"/>
  <path d="M 431,256 C 340,256 256,340 256,431" fill="none" stroke="#e8f890" stroke-width="6" stroke-dasharray="4,18" stroke-linecap="round"/>
</svg>
