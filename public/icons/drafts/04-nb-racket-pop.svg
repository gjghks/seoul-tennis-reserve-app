<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design 04: Racket Pop — Pink bg -->
  <rect width="512" height="512" fill="#f472b6" rx="80"/>
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#000" stroke-width="8" rx="78"/>

  <!-- Racket -->
  <g transform="translate(256,270) rotate(-30) translate(-256,-270)">
    <rect x="234" y="344" width="48" height="150" rx="10" fill="#000" transform="translate(4,4)"/>
    <rect x="232" y="340" width="48" height="150" rx="10" fill="#facc15" stroke="#000" stroke-width="5"/>
    <ellipse cx="256" cy="220" rx="100" ry="130" fill="#000" transform="translate(4,4)"/>
    <ellipse cx="256" cy="220" rx="100" ry="130" fill="#facc15" stroke="#000" stroke-width="5"/>
    <g stroke="#000" stroke-width="2" opacity="0.25">
      <line x1="196" y1="120" x2="196" y2="320"/>
      <line x1="216" y1="100" x2="216" y2="335"/>
      <line x1="236" y1="92" x2="236" y2="344"/>
      <line x1="256" y1="90" x2="256" y2="348"/>
      <line x1="276" y1="92" x2="276" y2="344"/>
      <line x1="296" y1="100" x2="296" y2="335"/>
      <line x1="316" y1="120" x2="316" y2="320"/>
      <line x1="160" y1="160" x2="352" y2="160"/>
      <line x1="157" y1="190" x2="355" y2="190"/>
      <line x1="156" y1="220" x2="356" y2="220"/>
      <line x1="157" y1="250" x2="355" y2="250"/>
      <line x1="160" y1="280" x2="352" y2="280"/>
      <line x1="170" y1="310" x2="342" y2="310"/>
    </g>
  </g>

  <!-- Ball NB shadow -->
  <circle cx="388" cy="148" r="88" fill="#000"/>
  <circle cx="376" cy="136" r="88" fill="#a3e635"/>
  <circle cx="376" cy="136" r="88" fill="none" stroke="#000" stroke-width="5"/>

  <!-- SEAM (center 376,136, radius 88, Lucide proportions) -->
  <!-- left=288, top=48, right=464, bottom=224 -->
  <path d="M 288,136 C 334,136 376,99 376,48" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 464,136 C 418,136 376,173 376,224" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M 288,136 C 334,136 376,99 376,48" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M 464,136 C 418,136 376,173 376,224" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

  <ellipse cx="350" cy="110" rx="16" ry="10" fill="#fff" opacity="0.2" transform="rotate(-30 350 110)"/>
</svg>
