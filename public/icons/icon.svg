<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="서울 테니스">
  <!-- C1 Bold Flat Ball — "any" master (full-bleed plate + hard offset shadow). Source for icon-*.png + apple-touch. -->
  <defs>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="200"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#facc15"/>
  <!-- neo-brutalist hard offset shadow (solid, no blur) -->
  <circle cx="270" cy="270" r="200" fill="#000000"/>
  <!-- optic-yellow tennis ball -->
  <circle cx="256" cy="256" r="200" fill="#d7ff2e"/>
  <!-- single continuous S-seam: 180° point-symmetric (reads as a tennis ball, never an eye) -->
  <g clip-path="url(#ballClip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 56 C120 112 120 206 256 256 C392 306 392 400 256 456" stroke="#000000" stroke-width="40"/>
    <path d="M256 56 C120 112 120 206 256 256 C392 306 392 400 256 456" stroke="#ffffff" stroke-width="22"/>
  </g>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#000000" stroke-width="16"/>
</svg>
